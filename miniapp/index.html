<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOADER -->
  <div id="loader" style="display:flex; position:fixed; inset:0; background:#1a1a2e;
       align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:12px;">
    <div style="font-size:40px">⏳</div>
    <div style="color:#a0a0c0; font-size:14px">Savollar yuklanmoqda...</div>
  </div>

  <!-- ══════════ TEST EKRANI ══════════ -->
  <div id="test-screen" style="display:none">

    <div class="header">
      <div class="header-title" id="header-title">📚 Test</div>
      <div class="score-badge" id="score-badge">0 ball</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:3%"></div>
      </div>
      <div class="progress-text">
        <span id="progress-label">1 / 35</span>
      </div>
    </div>

    <div class="question-section">
      <img id="question-img" class="question-img" style="display:none" alt="savol rasmi">
      <div class="question-num"  id="question-num">SAVOL 1</div>
      <div class="question-text" id="question-text">Yuklanmoqda...</div>
    </div>

    <div class="options" id="options"></div>

    <div class="feedback" id="feedback" style="display:none"></div>

    <div class="actions">
      <button class="btn btn-skip"   id="btn-skip"   onclick="skipQuestion()">⏭ O'tkazish</button>
      <button class="btn btn-next"   id="btn-next"   onclick="nextQuestion()" style="display:none">Keyingi →</button>
      <button class="btn btn-finish" id="btn-finish" onclick="showResult()"   style="display:none">✅ Tugatish</button>
    </div>

    <div class="grid-section">
      <div class="grid-label">Savollar paneli</div>
      <div class="grid" id="grid"></div>
    </div>

  </div>

  <!-- ══════════ NATIJA EKRANI ══════════ -->
  <div id="result-screen" style="display:none">

    <div class="result-top">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <div class="result-grade" id="result-grade">Ajoyib!</div>
      <div class="result-score" id="result-score">0%</div>
    </div>

    <div class="result-stats">
      <div class="stat-card stat-c">
        <div class="stat-val" id="r-correct">0</div>
        <div class="stat-lbl">To'g'ri</div>
      </div>
      <div class="stat-card stat-w">
        <div class="stat-val" id="r-wrong">0</div>
        <div class="stat-lbl">Xato</div>
      </div>
      <div class="stat-card stat-s">
        <div class="stat-val" id="r-skip">0</div>
        <div class="stat-lbl">O'tkazildi</div>
      </div>
    </div>

    <div class="result-grid-box">
      <div class="grid-label">Har bir savol:</div>
      <div class="grid" id="result-grid"></div>
    </div>

    <button class="btn-send" id="btn-send" onclick="sendResult()">
      📤 Natijani yuborish
    </button>

  </div>

  <script src="main.js"></script>
</body>
</html>
