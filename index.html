<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">Savollar yuklanmoqda...</div>
</div>

<div id="test-screen">
  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="header-title" id="header-title">📚 Test</div>
      <div class="header-sub"   id="header-sub">Yuklanmoqda...</div>
    </div>
    <div class="score-badge" id="score-badge">0 ball</div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-row">
      <span class="progress-num" id="progress-num">1 / 30</span>
      <span class="progress-pct" id="progress-pct">3%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:3%"></div>
    </div>
  </div>

  <!-- SAVOL -->
  <div class="question-card">
    <img id="question-img" class="question-img" style="display:none" alt="">
    <div class="question-badge" id="question-badge">SAVOL 1</div>
    <div class="question-text"  id="question-text">Yuklanmoqda...</div>
  </div>

  <!-- VARIANTLAR -->
  <div class="options" id="options"></div>

  <!-- FEEDBACK -->
  <div class="feedback" id="feedback"></div>

  <!-- TUGMALAR -->
  <div class="actions">
    <button class="btn btn-skip"   id="btn-skip"   onclick="skipQuestion()">⏭ O'tkazish</button>
    <button class="btn btn-next"   id="btn-next"   onclick="nextQuestion()"  style="display:none">Keyingi →</button>
    <button class="btn btn-finish" id="btn-finish" onclick="showResult()"    style="display:none">✅ Yakunlash</button>
  </div>

  <!-- SAVOLLAR PANELI -->
  <div class="grid-section">
    <div class="grid-label">Savollar paneli</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- NATIJA EKRANI -->
<div id="result-screen">
  <div class="result-top">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <div class="result-grade" id="result-grade">Ajoyib!</div>
    <div class="result-score" id="result-score">0%</div>
  </div>

  <div class="result-stats">
    <div class="stat-card stat-c">
      <div class="stat-val" id="stat-correct">0</div>
      <div class="stat-lbl">✅ To'g'ri</div>
    </div>
    <div class="stat-card stat-w">
      <div class="stat-val" id="stat-wrong">0</div>
      <div class="stat-lbl">❌ Xato</div>
    </div>
    <div class="stat-card stat-s">
      <div class="stat-val" id="stat-skip">0</div>
      <div class="stat-lbl">⏭ O'tkazildi</div>
    </div>
  </div>

  <div class="result-grid-box">
    <div class="result-grid-title">Har bir savol natijasi</div>
    <div class="grid" id="result-grid"></div>
    <p style="font-size:12px;color:#64748b;margin-top:8px;">⏭ Sariq — o'tkazilgan, bosib qaytib ishlang</p>
  </div>

  <div class="result-grid-box">
    <div class="result-grid-title">To'g'ri javoblar</div>
    <div id="answer-list"></div>
  </div>

  <div style="padding:16px 16px 40px;">
    <button onclick="closeApp()"
      style="background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;
             border:none;border-radius:14px;padding:15px 0;font-size:16px;
             font-weight:700;cursor:pointer;width:100%;
             box-shadow:0 4px 20px rgba(99,102,241,0.35);">
      ✖ Yopish
    </button>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
